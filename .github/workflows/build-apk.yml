name: Compila APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Controlla il progetto
        run: gradle projects --stacktrace

      - name: Compila APK di prova
        run: gradle assembleDebug --stacktrace

      - name: Rendi scaricabile l'APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveFacile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
